# DSH bundle patch — mounts this package's plugin in the global composition.
# `insert` appends rows; a relative `name` is anchored beside this patch file
# (see dsh-app-boot `anchorInsertedPluginNames`), so './lib/index.js' resolves
# to this package's plugin module wherever it is installed.
- insert:
    - id: explainer-video-from-coursework
      name: './lib/index.js'
