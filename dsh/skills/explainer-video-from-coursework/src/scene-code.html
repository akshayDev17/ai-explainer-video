<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Code / Refactor scene host</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 1920px; height: 1080px;
    overflow: hidden; background: #080e1a;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  #stage { position: relative; width: 1920px; height: 1080px; }
  .panel-wrap, .note-wrap { position: absolute; inset: 0; }
  .note-wrap { pointer-events: none; }

  /* ---- chrome ---- */
  .chrome { position: absolute; inset: 0; pointer-events: none; }
  .hdr {
    position: absolute; left: 74px; top: 48px; display: flex; align-items: center; gap: 14px;
    color: #e8eefc; font-size: 25px; font-weight: 700;
  }
  .hdr-dot { width: 18px; height: 18px; border-radius: 50%; background: #fbbf24; display: inline-block; }
  .stage-badge {
    position: absolute; right: 74px; top: 38px; padding: 13px 34px; border-radius: 25px;
    background: #0f1c31; border: 1.5px solid #22334f; color: #fbbf24;
    font-size: 22px; font-weight: 700; letter-spacing: 0.8px; opacity: 0;
  }
  .prog { position: absolute; left: 0; bottom: 0; width: 1920px; height: 6px; background: #0d1728; }
  .prog-fill { height: 6px; background: #fbbf24; opacity: .85; }

  /* ---- code panel ---- */
  .panel { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform, opacity; }
  .card {
    background: #0d1728; border: 2px solid #22334f; border-radius: 16px;
    overflow: hidden; box-shadow: 0 24px 70px rgba(0,0,0,.55);
  }
  .accent-bad .card  { border-color: rgba(251,113,133,.55); }
  .accent-ok  .card  { border-color: rgba(52,211,153,.55); }

  .tab {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 24px; background: #0f1c31; border-bottom: 1px solid #22334f;
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #34d399; flex: none; }
  .accent-bad .dot { background: #fb7185; }
  .accent-ok  .dot { background: #34d399; }
  .fname { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 20px; font-weight: 500; color: #93a7c8; }
  .badge {
    margin-left: auto; font-size: 15px; font-weight: 800; letter-spacing: 1.2px;
    padding: 5px 14px; border-radius: 14px;
  }
  .accent-bad .badge { color: #fb7185; background: rgba(251,113,133,.12); border: 1px solid rgba(251,113,133,.4); }
  .accent-ok  .badge { color: #34d399; background: rgba(52,211,153,.12); border: 1px solid rgba(52,211,153,.4); }

  .code {
    padding: 20px 26px 24px 18px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 22px; line-height: 34px;
  }
  .ln { display: flex; gap: 18px; white-space: pre; border-radius: 5px; }
  .ln .num { width: 38px; flex: none; text-align: right; color: #3d4c66; user-select: none; }
  .ln .txt { color: #d6deeb; }
  .ln.focused { background: rgba(251,113,133,.10); box-shadow: -3px 0 0 rgba(251,113,133,.85); }
  .accent-ok .ln.focused { background: rgba(52,211,153,.10); box-shadow: -3px 0 0 rgba(52,211,153,.85); }

  /* ---- tokens ---- */
  .t-k { color: #c792ea; }   /* keyword  */
  .t-t { color: #82aaff; }   /* type     */
  .t-f { color: #82aaff; }   /* function */
  .t-s { color: #c3e88d; }   /* string   */
  .t-c { color: #55688a; font-style: italic; }
  .t-n { color: #f78c6c; }   /* number   */
  .t-u { color: #89ddff; }   /* punct    */
  .t-p { color: #d6deeb; }

  /* ---- annotation notes ---- */
  .note {
    position: absolute; transform: translate(-50%, 0); opacity: 0;
    padding: 14px 26px; border-radius: 14px; font-size: 24px; font-weight: 600;
    background: #101d33; border: 1.5px solid #2b3d5c; color: #e8eefc; white-space: nowrap;
    box-shadow: 0 12px 34px rgba(0,0,0,.45);
  }
  .note-bad { border-color: rgba(251,113,133,.5); color: #ffd9df; }
  .note-ok  { border-color: rgba(52,211,153,.5); color: #d6fff0; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="scene-code.js"></script>
<script>
  // config name comes from ?scene=<name>, ?work=<dir> scopes the scene path per-video
  var Q = new URLSearchParams(location.search);
  var NAME = Q.get('scene') || 'ocp-refactor';
  var WORK = Q.get('work') || '';
  var s = document.createElement('script');
  s.src = WORK ? WORK + '/scenes/' + NAME + '.js' : '../scenes/' + NAME + '.js';
  s.onload = function () {
    var cfg = window.SCENE_CONFIG;
    var scene = window.CodeScenes.create({ root: document.getElementById('stage'), config: cfg });
    window.renderAt = function (t) { scene.renderAt(t); return true; };
    window.VIDEO_META = { width: 1920, height: 1080, fps: cfg.fps || 30, total: cfg.total };
  };
  document.head.appendChild(s);
</script>
</body>
</html>
