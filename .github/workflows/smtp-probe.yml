# TEMPORARY DIAGNOSTIC — delete once the answer is known.
#
# Question: can a GitHub-hosted runner actually open an SMTP connection to
# smtp.gmail.com, and does STARTTLS complete? Several sources claim outbound
# SMTP is blocked from Actions, which would make the whole notification
# design unworkable. Rather than trust a forum post, ask the runner.
#
# This does the real handshake the notifier performs, stopping just before
# login, so it needs no credentials: TCP connect -> EHLO -> STARTTLS -> EHLO.
# Each port is a separate matrix job so the result is readable per port from
# the runs API, which is all that is available without a token.

name: smtp-probe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - port: 587
            mode: starttls
          - port: 465
            mode: ssl
    steps:
      - name: Handshake with smtp.gmail.com:${{ matrix.port }} (${{ matrix.mode }})
        env:
          PORT: ${{ matrix.port }}
          MODE: ${{ matrix.mode }}
        run: |
          python3 - <<'PY'
          import os, smtplib, ssl, sys

          port = int(os.environ["PORT"])
          mode = os.environ["MODE"]
          ctx = ssl.create_default_context()
          try:
              if mode == "ssl":
                  server = smtplib.SMTP_SSL("smtp.gmail.com", port, timeout=25, context=ctx)
              else:
                  server = smtplib.SMTP("smtp.gmail.com", port, timeout=25)
                  server.ehlo()
                  server.starttls(context=ctx)
                  server.ehlo()
          except Exception as exc:
              print(f"RESULT port={port} mode={mode} FAIL {type(exc).__name__}: {exc}")
              sys.exit(1)
          print(f"RESULT port={port} mode={mode} OK server={server.esmtp_features.get('auth')}")
          server.quit()
          PY
