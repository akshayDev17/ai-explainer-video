# Tag-triggered release — publishes BOTH npm packages with OIDC trusted
# publishing, so no npm token exists on any machine or in any secret.
#
# A release is now: bump the versions, commit, tag, push the tag.
#
# One-time prerequisite (see RELEASING.md): a Trusted Publisher configured on
# npmjs.com for EACH package, pointing at this repo + this workflow file.

name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  # Mints the OIDC token npm exchanges for a short-lived publish credential.
  # This single line is the whole replacement for an NPM_TOKEN secret.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          # Required: setup-node writes the .npmrc that points npm at the public
          # registry. Without it `npm publish` fails with ENEEDAUTH.
          registry-url: "https://registry.npmjs.org"

      - name: Tag must match the package version
        run: |
          set -e
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  version=$VERSION"
          [ "$TAG" = "$VERSION" ] || { echo "::error::tag $TAG != package.json version $VERSION"; exit 1; }

      - name: Stage the package
        run: |
          # Staged publishing: this queues the version, and a maintainer approves it
          # on npm before it becomes installable. The trusted-publisher config
          # deliberately omits "Allow npm publish", so a compromised run can ask to
          # ship but cannot ship.
          #
          # npm 10 — the version bundled with Node 22 — is too old on both counts:
          # the OIDC token exchange landed in 11.5.1, and `stage` needs 11.15.0.
          # Pin via npx so the runner needs no write access to the hosted tool
          # cache. Staging also requires Node >= 22.14.0; "22" resolves to the
          # newest 22.x, which satisfies that.
          # Provenance needs no flag: trusted publishing emits it by default.
          npx --yes npm@11.15.0 stage publish
