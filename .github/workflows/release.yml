# Release on demand — a human clicks "Run workflow".
#
# Normal commits to main do nothing. A release happens only when this workflow
# is dispatched manually, and it does the whole job: pick the version, bump all
# three manifests, run `npm stage publish` (which queues a candidate a human then
# approves on npmjs.com), and only after a successful stage commit + tag.
#
# One-time prerequisites (see RELEASING.md):
#   - a Trusted Publisher on npmjs.com that permits staging (not direct publish);
#   - an npm username in the NPM_USER repository variable for the approval link.

name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver increment (ignored if you set an explicit version)"
        required: true
        type: choice
        default: "patch"
        options: ["patch", "minor", "major"]
      version:
        description: "Explicit version, e.g. 0.3.0 (optional — overrides bump)"
        required: false
        type: string

permissions:
  contents: write        # push the release commit + tag
  id-token: write        # OIDC token npm exchanges for a staging credential

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Set up Python (for the notification)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Mark start time
        id: start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Set git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # One step so a single outcome drives the notification. Order matters:
      # stage BEFORE commit+tag, so a failed stage does not consume the version —
      # the next manual run recomputes the same version and retries cleanly.
      - name: Release
        id: release
        env:
          BUMP: ${{ inputs.bump }}
          VERSION_OVERRIDE: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true); CURRENT=${CURRENT#v}
          [ -z "$CURRENT" ] && CURRENT=$(node -p "require('./package.json').version")
          if [ -n "$VERSION_OVERRIDE" ]; then
            NEXT="$VERSION_OVERRIDE"
          else
            NEXT=$(node scripts/next-version.mjs "$CURRENT" "$BUMP")
          fi
          echo "releasing: $CURRENT -> $NEXT"
          node scripts/bump.mjs "$NEXT"

          {
            npx --yes npm@11.15.0 stage publish
            git add package.json plugin.json .claude-plugin/plugin.json
            git commit -m "chore(release): $NEXT"
            git tag "v$NEXT"
            git push origin "v$NEXT" HEAD:main
          } 2>&1 | tee "$RUNNER_TEMP/release.log"

          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

      # Email on success or failure; silent only if the release step was skipped
      # (which cannot happen for a manual dispatch, but notify.py is defensive).
      - name: Notify
        if: always()
        env:
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          RELEASED: ${{ steps.release.outputs.released }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_LOG: ${{ runner.temp }}/release.log
          START_EPOCH: ${{ steps.start.outputs.epoch }}
          PACKAGE: explainer-video-from-coursework
          NPM_USER: ${{ vars.NPM_USER }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_TLS: ${{ vars.SMTP_TLS }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          OAUTH_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME }}
          MAIL_TO: ${{ vars.MAIL_TO }}
        run: |
          python -m pip install --quiet jinja2
          python .github/scripts/notify.py
