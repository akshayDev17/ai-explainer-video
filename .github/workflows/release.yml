# Release on demand — a human clicks "Run workflow".
#
# Normal commits to main do nothing. A release happens only when this workflow
# is dispatched manually, and it does the whole job: pick the version, bump all
# three manifests, publish straight to npm, and only after a successful publish
# commit + tag.
#
# One-time prerequisite (see RELEASING.md): a Trusted Publisher on npmjs.com with
# "Allow npm publish" checked.

name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver increment (ignored if you set an explicit version)"
        required: true
        type: choice
        default: "patch"
        options: ["patch", "minor", "major"]
      version:
        description: "Explicit version, e.g. 0.3.0 (optional — overrides bump)"
        required: false
        type: string
  # TEMPORARY tag-push entry point, removed right after this release. The machine
  # driving it has an SSH key but no GitHub token, so it cannot call
  # workflow_dispatch; a tag push is the only authenticated action available. A
  # GITHUB_TOKEN bridge could not dispatch either ("Resource not accessible").
  # workflow_dispatch above remains the real, documented interface.
  push:
    tags: ["go-release-v*"]

permissions:
  contents: write        # push the release commit + tag
  id-token: write        # OIDC token npm exchanges for a publish credential

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Set up Python (for the notification)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Mark start time
        id: start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Set git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # One step so a single outcome drives the notification, and the order inside it
      # is the design: publish, then WAIT for the registry to admit the version
      # exists, then commit + tag. Nothing is recorded in git until the registry
      # confirms, so a publish that consumed a version without shipping it can never
      # be papered over by a tag.
      #
      # Waiting is not paranoia. npm answers 404 for a version it accepted seconds
      # ago and says so itself ("Your package is being processed and may take a few
      # minutes to become available"). Measured on the sibling package: 7.5 minutes
      # between "+ coursework-author@1.0.1" and the version becoming readable.
      # Reading that 404 as a failed publish is how a correct release goes red.
      - name: Release
        id: release
        env:
          # Empty on the temporary tag-push entry point (a push event carries no
          # inputs); the step defaults it in shell, where the semantics are plain.
          BUMP: ${{ inputs.bump }}
          VERSION_OVERRIDE: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Everything this step prints lands in the log file Notify attaches — and,
          # while the temporary telemetry step exists, in a branch readable without a
          # GitHub token or API quota.
          exec > >(tee "$RUNNER_TEMP/release.log") 2>&1

          BUMP=${BUMP:-minor}
          echo "bump=$BUMP"
          PKG=$(node -p "require('./package.json').name")
          CURRENT=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true); CURRENT=${CURRENT#v}
          [ -z "$CURRENT" ] && CURRENT=$(node -p "require('./package.json').version")
          if [ -n "$VERSION_OVERRIDE" ]; then
            NEXT="$VERSION_OVERRIDE"
          else
            NEXT=$(node scripts/next-version.mjs "$CURRENT" "$BUMP")
          fi
          echo "releasing: $PKG $CURRENT -> $NEXT"
          node scripts/bump.mjs "$NEXT"

          # Ask the registry itself, not npm's cache, so a stale packument cannot
          # answer for the registry. Anonymous reads suffice: public package.
          registry_has() {
            curl -fsS -H 'Accept: application/json' \
              "https://registry.npmjs.org/$1/$2" -o /dev/null
          }

          {
            if registry_has "$PKG" "$NEXT"; then
              # A previous run may have published this version and died before the
              # bookkeeping below. Publishing again would be refused ("cannot publish
              # over the previously published versions"), so resume instead: finish
              # the release the registry already agreed to.
              echo "note: $PKG@$NEXT is already published — resuming the release"
            else
              npx --yes npm@11.15.0 publish
            fi

            ATTEMPTS=48          # 48 x 15s = 12 minutes, twice the measured worst case
            for attempt in $(seq 1 "$ATTEMPTS"); do
              registry_has "$PKG" "$NEXT" && break
              if [ "$attempt" -eq "$ATTEMPTS" ]; then
                echo "::error::$PKG@$NEXT is still absent from the registry after 12 minutes."
                echo "Check https://www.npmjs.com/package/$PKG/v/$NEXT before re-dispatching:"
                echo "if it landed, re-dispatch with version=$NEXT and the publish is skipped."
                exit 1
              fi
              echo "waiting for $PKG@$NEXT (attempt $attempt/$ATTEMPTS)"
              sleep 15
            done
            echo "registry confirms $PKG@$NEXT"

            git add package.json plugin.json .claude-plugin/plugin.json
            if git diff --cached --quiet; then
              echo "note: manifests already at $NEXT — nothing to commit"
            else
              git commit -m "chore(release): $NEXT"
            fi
            if git rev-parse -q --verify "refs/tags/v$NEXT" > /dev/null; then
              echo "note: tag v$NEXT already exists"
            else
              git tag "v$NEXT"
            fi
            git push origin "v$NEXT" HEAD:main
          }

          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

      # Email on success or failure; silent only if the release step was skipped
      # (which cannot happen for a manual dispatch, but notify.py is defensive).
      #
      # continue-on-error: a mail server must not be able to turn a release that
      # published correctly into a red run. That happened: the publish succeeded and
      # the job failed on "OAuth token refresh failed — HTTP 400: invalid_grant",
      # which was a wrong SMTP_USER, not a release problem. The failure is still
      # visible as a warning and the log is attached; it just cannot fail the job.
      - name: Notify
        if: always()
        continue-on-error: true
        env:
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          RELEASED: ${{ steps.release.outputs.released }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_LOG: ${{ runner.temp }}/release.log
          START_EPOCH: ${{ steps.start.outputs.epoch }}
          PACKAGE: explainer-video-from-coursework
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_TLS: ${{ vars.SMTP_TLS }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          OAUTH_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME }}
          MAIL_TO: ${{ vars.MAIL_TO }}
        run: |
          python -m pip install --quiet jinja2
          python .github/scripts/notify.py

      # TEMPORARY, deleted with the tag-push entry point above. GitHub requires admin
      # rights to read a job's log and the unauthenticated API is quota-limited, so a
      # release driven from a machine without a token cannot see what it did. This
      # publishes the same log the Notify step attaches, plus the step outcomes, to a
      # side branch — an outcome channel that needs no credentials.
      - name: Publish outcome (temporary)
        if: always()
        run: |
          set -euo pipefail
          mkdir -p .telemetry
          cp "$RUNNER_TEMP/release.log" .telemetry/release.log 2>/dev/null \
            || echo "(the Release step never reached its first echo)" > .telemetry/release.log
          {
            echo "outcome=${{ steps.release.outcome }}"
            echo "released=${{ steps.release.outputs.released }}"
            echo "version=${{ steps.release.outputs.version }}"
            echo "run_id=${{ github.run_id }}"
            echo "ref=${{ github.ref }}"
            echo "event=${{ github.event_name }}"
            echo "sha=${{ github.sha }}"
          } > .telemetry/status.txt
          git checkout -q -B telemetry
          git add -f .telemetry
          git -c user.name=ci -c user.email=ci@localhost commit -qm "telemetry run ${{ github.run_id }}"
          git push -q -f origin telemetry
          cat .telemetry/status.txt
