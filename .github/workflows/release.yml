# Release on merge to main — semantic-release.
#
# semantic-release reads conventional-commit messages since the last git tag:
#   fix:  -> patch   feat: -> minor   feat!: -> major   chore:/docs:/ci: -> nothing.
# On a release it bumps package.json + the two plugin manifests in lockstep, writes
# CHANGELOG.md, commits them with [skip ci] (so this workflow does not re-trigger),
# tags vX.Y.Z, and runs `npm stage publish` so a human approves on npmjs.com before
# anything becomes installable.
#
# One-time prerequisites (see RELEASING.md):
#   - a Trusted Publisher on npmjs.com that permits staging (not direct publish);
#   - an npm username in the NPM_USER repository variable for the approval link.

name: release

on:
  push:
    branches: [main]

permissions:
  contents: write        # semantic-release pushes the release commit + tag
  id-token: write        # OIDC token npm exchanges for a staging credential

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0    # full history — semantic-release reads commits since the last tag

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"   # npm stage publish reads this

      - name: Set up Python (for the notification)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Mark start time
        id: start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Set git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # One step does everything: analyze -> bump -> sync manifests -> changelog ->
      # commit [skip ci] + tag -> npm stage publish. On a chore:/docs:/ci: push it
      # finds nothing to release and exits 0 (no output, no email). successCmd
      # writes `released` + `version` to the step outputs on an actual release.
      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          npx semantic-release 2>&1 | tee "$RUNNER_TEMP/release.log"

      # Runs on every outcome. notify.py decides from RELEASE_OUTCOME + RELEASED:
      #   failure  -> red email with the release log tail
      #   released -> "staged, approve on npm" email
      #   otherwise-> silent no-op.
      - name: Notify
        if: always()
        env:
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          RELEASED: ${{ steps.release.outputs.released }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_LOG: ${{ runner.temp }}/release.log
          START_EPOCH: ${{ steps.start.outputs.epoch }}
          PACKAGE: explainer-video-from-coursework
          NPM_USER: ${{ vars.NPM_USER }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_TLS: ${{ vars.SMTP_TLS }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          OAUTH_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME }}
          MAIL_TO: ${{ vars.MAIL_TO }}
        run: |
          python -m pip install --quiet jinja2
          python .github/scripts/notify.py
