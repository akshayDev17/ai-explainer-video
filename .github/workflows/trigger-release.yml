# TEMPORARY — delete immediately after use. It exists for one reason: releasing
# requires a workflow_dispatch, which requires an authenticated API call, and the
# machine doing this work has an SSH key but no GitHub token. A tag push is the only
# authenticated action available from there, so this turns a tag push into a genuine
# workflow_dispatch of release.yml.
#
# Deliberately NOT a push trigger on release.yml itself: that would run the release
# on a different event with empty inputs, i.e. test something other than what a human
# dispatch does. This fires the real thing — same event, same inputs, same ref.
name: trigger-release

on:
  push:
    tags: ["go-release-v*"]

permissions:
  actions: write         # dispatch another workflow
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: ${{ vars.TRIGGER_RELEASE_BUMP || 'minor' }}
        run: |
          set -euo pipefail
          echo "dispatching release.yml with bump=$BUMP"
          gh workflow run release.yml --ref main -f bump="$BUMP"
          sleep 10
          gh run list --workflow=release.yml --limit 3
