# CI — the checks that cost nothing and catch the things humans don't.
#
# The vendored-skill gate is the generated-artifact check: skills/coursework-author is
# COPIED out of the coursework-author package because the four plugin hosts (Claude,
# Codex, Gemini, DSH) only load skills from a plugin's own tree. That copy must never be
# hand-edited, so CI regenerates the comparison and fails on any drift.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write          # the bot job below commits the resync to the PR branch

jobs:
  tools:
    name: tools parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      # The tools live inside the skill dir, not at the repo root. Globs are expanded
      # here (fail-fast if nothing matches), so a moved directory breaks loudly instead
      # of handing `node --check` a literal pattern -- which is what failed CI run #1.
      - run: |
          set -euo pipefail
          shopt -s nullglob
          files=(scripts/*.mjs scripts/lib/*.mjs skills/*/tools/*.mjs skills/*/tools/*/*.mjs skills/*/src/*.js lib/*.js test/*.mjs)
          [ ${#files[@]} -gt 0 ] || { echo "no source files matched — the layout moved"; exit 1; }
          for f in "${files[@]}"; do node --check "$f"; done
          echo "parsed ${#files[@]} files"
      - run: echo "all tools parse"

      # A release re-run bumps to the version it is already at. That used to be
      # reported as "no version field found" (the no-op replace and the missing field
      # were the same branch), so the recovery path a dead release needs was itself
      # broken. Runs in a temp copy, since bump.mjs writes the manifests in place.
      - name: bump is idempotent and touches every manifest
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cp package.json plugin.json "$tmp/"
          mkdir -p "$tmp/.claude-plugin" "$tmp/.agents/plugins"
          cp .claude-plugin/plugin.json .claude-plugin/marketplace.json "$tmp/.claude-plugin/"
          cp .agents/plugins/marketplace.json "$tmp/.agents/plugins/"
          v=$(node -p "require('./package.json').version")
          cd "$tmp"
          node "$GITHUB_WORKSPACE/scripts/bump.mjs" "$v"
          node "$GITHUB_WORKSPACE/scripts/bump.mjs" 9.9.9
          for f in package.json plugin.json .claude-plugin/plugin.json; do
            grep -q '"version": "9.9.9"' "$f" || { echo "::error::$f was not bumped"; exit 1; }
          done
          # The marketplaces pin a range, which is what Claude/Codex/Gemini install
          # from. A bump that skips them is a release those hosts never see.
          for f in .claude-plugin/marketplace.json .agents/plugins/marketplace.json; do
            grep -q '"version": "\^9.9.9"' "$f" || { echo "::error::$f pin was not bumped"; exit 1; }
          done
          echo "bump: idempotent at the current version, complete at a new one"

      # The pin that sent Claude, Codex and Gemini to 0.1.2 for six releases while the
      # package was on 0.4.0. Nothing read it; now something does.
      - name: Marketplace pins track the package version
        run: node scripts/check-marketplace-pins.mjs

  # The miner's behaviour on small synthetic repos: group rules, each rule pack against its
  # golden links, the resolver fixes, test-to-code links, the CLI contract. Offline and
  # dependency-free: the tools run on the vendored tree-sitter, so no npm install.
  tests:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: npm test

  # skills/explainer-video-from-codebase/vendor/tree-sitter is COPIED from the pinned
  # devDependencies (Antigravity installs by git clone and never runs npm install). Like the
  # coursework-author gate: regenerate the comparison and fail on any drift, including a
  # version bump that skipped the resync.
  vendored-grammars:
    name: vendored tree-sitter in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: node scripts/check-tree-sitter-vendor.mjs --installed

  vendored-skill:
    name: skills/coursework-author in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }

      # The dependency is a `file:` spec until coursework-author is published; a sibling
      # checkout isn't available on CI, so the gate arms itself only once it is a registry
      # range (e.g. "^1.0.0"). It is a hard failure from that moment on.
      - id: dep
        run: |
          spec=$(node -p "require('./package.json').devDependencies?.['coursework-author'] ?? ''")
          echo "spec: $spec"
          case "$spec" in
            file:*|link:*|"") echo "run=false" >> "$GITHUB_OUTPUT" ;;
            *)                echo "run=true"  >> "$GITHUB_OUTPUT" ;;
          esac

      # --ignore-scripts: the tree-sitter grammar packages carry native-build install scripts
      # nothing here uses; only their prebuilt WASM is vendored.
      - if: steps.dep.outputs.run == 'true'
        run: npm install --no-audit --no-fund --ignore-scripts
      - if: steps.dep.outputs.run == 'true'
        run: npm run check:coursework-author-sync

      # A dependency bump opened by a bot must arrive with the regenerated copy, or the
      # human merges a PR that fails its own gate. So the bot finishes its own PR.
      - if: steps.dep.outputs.run == 'true' && (github.actor == 'renovate[bot]' || github.actor == 'dependabot[bot]')
        run: |
          npm run sync:coursework-author
          if [ -n "$(git status --porcelain skills/coursework-author)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add skills/coursework-author
            git commit -m "chore(skills): resync coursework-author from $(node -p "require('./node_modules/coursework-author/package.json').version")"
            git push
          else
            echo "already in sync"
          fi
