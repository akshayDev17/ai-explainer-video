<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SVG scene host — the open lane</title>
<style>
  html, body { margin:0; padding:0; width:1920px; height:1080px; overflow:hidden; background:#080e1a; }
  svg#stage { display:block; width:1920px; height:1080px; }
  /* must match the font textW() measures with, or primitive layout drifts */
  text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
</style>
</head>
<body>
<!--
  Open lane for stage 5. The author's scene script defines:

    window.SCENE_CONFIG = { renderAt(t, svg, timeline) }

  renderAt is a PURE function of time: it draws the frame for t and returns, so
  frames can be rendered in any order and re-rendered after an audio change. The
  author owns the SVG completely — no node kinds, no fixed vocabulary.
-->
<svg id="stage" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>

<script src="scene-core.js"></script>
<script>
  var Q = new URLSearchParams(location.search);
  var NAME = Q.get('scene') || 'svg';
  var WORK = Q.get('work') || '';
  var tlEl = document.createElement('script');
  tlEl.src = WORK ? '../' + WORK + '/timeline.js' : 'timeline.js';
  tlEl.onload = function () {
    var s = document.createElement('script');
    s.src = WORK ? '../' + WORK + '/scenes/' + NAME + '.js' : '../scenes/' + NAME + '.js';
    s.onload = function () {
      var TL = window.TIMELINE;
      var cfg = window.SCENE_CONFIG;
      if (!cfg || typeof cfg.renderAt !== 'function') {
        throw new Error(NAME + ': SCENE_CONFIG must expose renderAt(t, svg, timeline)');
      }
      var stage = document.getElementById('stage');
      window.renderAt = function (t) { cfg.renderAt(t, stage, TL); return true; };
      window.VIDEO_META = { width: TL.width, height: TL.height, fps: TL.fps, total: TL.total };
    };
    document.head.appendChild(s);
  };
  document.head.appendChild(tlEl);
</script>
</body>
</html>
